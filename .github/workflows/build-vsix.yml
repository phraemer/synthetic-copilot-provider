name: Build VSIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read extension version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build VSIX
        run: npm run package

      - name: Show VSIX
        run: ls -lh synthetic-copilot-provider.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-copilot-provider-${{ steps.version.outputs.value }}
          path: synthetic-copilot-provider.vsix
          if-no-files-found: error
          retention-days: 30
